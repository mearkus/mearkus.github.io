<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#1f1830"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#glow)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Scale -->
  <g transform="translate(150 170)">
    <rect width="200" height="200" rx="36" fill="#161616" stroke="#2a2a2a" stroke-width="2"/>
    <rect x="30" y="30" width="140" height="140" rx="24" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="60" y="62" width="80" height="34" rx="8" fill="#0d0d0d" stroke="#a78bfa" stroke-width="2"/>
    <text x="100" y="86" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="600">72.4</text>
    <text x="100" y="250" text-anchor="middle" fill="#6b6b6b" font-size="20">Wyze Scale</text>
  </g>

  <!-- Arrow -->
  <g fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
    <path d="M385 270H565" stroke-dasharray="2 14"/>
    <path d="M555 255l18 15-18 15"/>
  </g>
  <text x="480" y="245" text-anchor="middle" fill="#e8e8e8" font-size="26" font-weight="700" letter-spacing="-0.5">scalesync</text>

  <!-- Chart -->
  <g transform="translate(610 170)">
    <rect width="200" height="200" rx="36" fill="#161616" stroke="#2a2a2a" stroke-width="2"/>
    <path d="M30 140 L65 120 L95 128 L125 95 L170 70" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a78bfa"><circle cx="65" cy="120" r="5"/><circle cx="95" cy="128" r="5"/><circle cx="125" cy="95" r="5"/><circle cx="170" cy="70" r="6"/></g>
    <path d="M30 160H170" stroke="#2a2a2a" stroke-width="2"/>
    <text x="100" y="250" text-anchor="middle" fill="#6b6b6b" font-size="20">Garmin Connect</text>
  </g>
</svg>
